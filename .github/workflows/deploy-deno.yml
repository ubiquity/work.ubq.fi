name: Deploy (Deno Deploy)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-deno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      PROJECT: work-ubq-fi
      PREVIEW_PROJECT: work-ubq-fi-preview
      PROD_BRANCH: ${{ github.event.repository.default_branch }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deployctl CLI
        run: |
          deno install -gArf jsr:@deno/deployctl@1.12.0
          echo "${HOME}/.deno/bin" >> $GITHUB_PATH

      - name: Build static assets
        run: deno task build
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

      - name: Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          target="$PREVIEW_PROJECT"
          prod_flag=""
          if [ "${GITHUB_REF_NAME}" = "$PROD_BRANCH" ]; then
            target="$PROJECT"
            prod_flag="--prod"
          fi

          # Derive excludes from .gitignore, but keep built assets in static/dist.
          mapfile -t ignored_paths < <(git ls-files -o --ignored --exclude-standard --directory --no-empty-directory)
          excludes=()
          for path in "${ignored_paths[@]}"; do
            case "$path" in
              static/dist|static/dist/*) continue ;;
            esac
            excludes+=("--exclude=${path}")
          done

          supabase_key="${SUPABASE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"

          deployctl deploy \
            --project="$target" \
            $prod_flag \
            --entrypoint=server.ts \
            --root="." \
            --token="$DENO_DEPLOY_TOKEN" \
            --include="." \
            --include="deno.json" \
            "${excludes[@]}" \
            --env-var="SUPABASE_URL=${SUPABASE_URL}" \
            --env-var="SUPABASE_KEY=${supabase_key}" \
            --env-var="SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --env-var="VOYAGEAI_API_KEY=${VOYAGEAI_API_KEY}"
