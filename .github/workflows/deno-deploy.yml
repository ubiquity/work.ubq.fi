name: Deno Deploy

on:
  push:
    branches-ignore:
      - dist/**
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  deploy:
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@main
    with:
      project: work-ubq-fi
      deploy_platform: deno2
      entrypoint: server.ts
      install_command: deno install
      build_command: deno task build
      build_env: |
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      runtime_env: |
        STATIC_DIR=static
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
        SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
        SUPABASE_KEY=$SUPABASE_SERVICE_ROLE_KEY
      debug_fetch_paths: |
        /
        /dist/home.js
        /style/inverted-style.css
        /favicon.png
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        SUPABASE_URL
        SUPABASE_ANON_KEY
    secrets: inherit
