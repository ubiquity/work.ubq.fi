plugins:
  - uses:
      - plugin: https://ubiquity-os-command-start-stop-main.ubiquity.workers.dev
        with:
          reviewDelayTolerance: "3 Days"
          taskStaleTimeoutDuration: "30 Days"
          startRequiresWallet: true
          maxConcurrentTasks:
            collaborator: 10
            contributor: 2
          assignedIssueScope: "org"
          emptyWalletText: "Please set your wallet address with the /wallet command first and try again."
          rolesWithReviewAuthority: ["OWNER", "ADMIN", "MEMBER", "COLLABORATOR"]
          requiredLabelsToStart:
            - name: "Priority: 1 (Normal)"
              allowedRoles: ['collaborator', 'contributor']
            - name: "Priority: 2 (Medium)"
              allowedRoles: ['collaborator', 'contributor']            
            - name: "Priority: 3 (High)"
              allowedRoles: ['collaborator']
            - name: "Priority: 4 (Urgent)"
              allowedRoles: ['collaborator']
            - name: "Priority: 5 (Emergency)"
              allowedRoles: ['collaborator']
  - uses:
      - plugin: https://ubiquity-os-command-wallet-main.ubiquity.workers.dev
        with:
          registerWalletWithVerification: false
  - uses:
      - plugin: https://ubiquity-os-command-query-user-main.ubiquity.workers.dev
        with:
          allowPublicQuery: true
  - uses:
      - plugin: ubiquity-os-marketplace/daemon-pricing@main
        with:
          labels:
            time:
              - name: "Time: <15 Minutes"
                collaboratorOnly: false
              - name: "Time: <1 Hour"
                collaboratorOnly: false
              - name: "Time: <2 Hours"
                collaboratorOnly: false
              - name: "Time: <4 Hours"
                collaboratorOnly: false
              - name: "Time: <1 Day"
                collaboratorOnly: false
              - name: "Time: <1 Week"
                collaboratorOnly: false
              - name: "Time: <1 Month"
                collaboratorOnly: false
            priority:
              - name: "Priority: 1 (Normal)"
                collaboratorOnly: false
              - name: "Priority: 2 (Medium)"
                collaboratorOnly: false
              - name: "Priority: 3 (High)"
                collaboratorOnly: false
              - name: "Priority: 4 (Urgent)"
                collaboratorOnly: false
              - name: "Priority: 5 (Emergency)"
                collaboratorOnly: false
          basePriceMultiplier: 2
          publicAccessControl:
            setLabel: true
            fundExternalClosedIssue: false
            protectLabels: ["priority", "price", "time"]
  - skipBotEvents: false
    uses:
      - plugin: ubiquity-os-marketplace/text-conversation-rewards@main
        with:
          evmNetworkId: 100
          evmPrivateEncrypted: "bd5AFnSCO6c5jJyPifpOfr5Zys29RE7SyXkEU3akT13RtGmYDrqGIGuvJQyH53HA5dIba7PL5bXfll0JebmwXYe5gHIXSGX80WuGMDHh0cFfeGjHhmUXe8kkZ1OT2De9qRpqejJcEzdfi-8XNAvP7cQu2Vt-7RNnPw" # https://github.com/ubiquibot/conversation-rewards/pull/111#issuecomment-2348639931
          erc20RewardToken: "0xC6ed4f520f6A4e4DC27273509239b7F8A68d2068"
          incentives:
            requirePriceLabel: true
            limitRewards: true
            collaboratorOnlyPaymentInvocation: true
            contentEvaluator: {}
            userExtractor:
              redeemTask: true
            dataPurge: {}
            formattingEvaluator:
              multipliers:
                - role:
                    - PULL_SPECIFICATION
                  multiplier: 1
                  rewards:
                    wordValue: 0.2
                    html:
                      br:
                        score: 0
                        countWords: false
                      code:
                        score: 5
                        countWords: false
                      p:
                        score: 0
                        countWords: true
                      em:
                        score: 0
                        countWords: true
                      img:
                        score: 5
                        countWords: true
                      strong:
                        score: 0
                        countWords: false
                      blockquote:
                        score: 0
                        countWords: false
                      h1:
                        score: 1
                        countWords: true
                      h2:
                        score: 1
                        countWords: true
                      h3:
                        score: 1
                        countWords: true
                      h4:
                        score: 1
                        countWords: true
                      h5:
                        score: 1
                        countWords: true
                      h6:
                        score: 1
                        countWords: true
                      a:
                        score: 5
                        countWords: true
                      li:
                        score: 0.5
                        countWords: true
                      ul:
                        score: 1
                        countWords: true
                      td:
                        score: 0
                        countWords: true
                      hr:
                        score: 0
                        countWords: true
                      pre:
                        score: 0
                        countWords: false
                      ol:
                        score: 1
                        countWords: true
                - role:
                    - ISSUE_SPECIFICATION
                    - ISSUE_AUTHOR
                    - ISSUE_ASSIGNEE
                    - ISSUE_COLLABORATOR
                    - ISSUE_CONTRIBUTOR
                    - PULL_ASSIGNEE
                    - PULL_COLLABORATOR
                    - PULL_CONTRIBUTOR
                  multiplier: 1
                  rewards:
                    wordValue: 0.1
                    html:
                      br:
                        score: 0
                        countWords: true
                      code:
                        score: 5
                        countWords: false
                      p:
                        score: 0
                        countWords: true
                      em:
                        score: 0
                        countWords: true
                      img:
                        score: 5
                        countWords: true
                      strong:
                        score: 0
                        countWords: false
                      blockquote:
                        score: 0
                        countWords: false
                      h1:
                        score: 1
                        countWords: true
                      h2:
                        score: 1
                        countWords: true
                      h3:
                        score: 1
                        countWords: true
                      h4:
                        score: 1
                        countWords: true
                      h5:
                        score: 1
                        countWords: true
                      h6:
                        score: 1
                        countWords: true
                      a:
                        score: 5
                        countWords: true
                      li:
                        score: 0.5
                        countWords: true
                      ul:
                        score: 1
                        countWords: true
                      td:
                        score: 0
                        countWords: true
                      hr:
                        score: 0
                        countWords: true
                      pre:
                        score: 0
                        countWords: false
                      ol:
                        score: 1
                        countWords: true
                - role:
                    - PULL_AUTHOR
                  multiplier: 0
                  rewards:
                    wordValue: 0
              wordCountExponent: 0.85
            permitGeneration: {}
            githubComment:
              post: true
              debug: false
          dataCollection:
            maxAttempts: 10
            delayMs: 1000
  - uses:
      - plugin: ubiquity-os-marketplace/daemon-disqualifier@main
        with:
          warning: "3.5 days"
          watch:
            optOut:
              - ubiquibot
              - launch-party
              - staging
              - production
          prioritySpeed: true
          disqualification: "7 days"
          pullRequestRequired: true
          eventWhitelist:
            - pull_request.review_requested
            - pull_request.ready_for_review
            - pull_request_review_comment.created
            - issue_comment.created
            - push
  - uses:
      - plugin: ubiquity-os-marketplace/daemon-merging@main
        with:
          approvalsRequired:
            collaborator: 1
            contributor: 2
          mergeTimeout:
            collaborator: "3.5 days"
          repos:
            ignore:
              - ubiquibot
              - launch-party
              - staging
              - production
          allowedReviewerRoles: ["COLLABORATOR", "MEMBER", "OWNER"]
  - uses:
      - plugin: ubiquity-os-marketplace/text-vector-embeddings@main
        with:
          matchThreshold: 0.95
          warningThreshold: 0.75
          jobMatchingThreshold: 0.75
          alwaysRecommend: 0
  - uses:
      - plugin: ubiquity-os-marketplace/daemon-pull-review@main